<div class="page">
    <a routerLink="/dashboard" class="back-link">← Back to Dashboard</a>

    <div class="header">
        <div class="header-icon">👤</div>
        <div>
            <h2>My Profile</h2>
            <p class="subtitle">Manage your account information</p>
        </div>
    </div>

    @if (loading()) {
    <p>Loading profile...</p>
    } @else {
    <div class="form-card">
        <form (ngSubmit)="onSubmit()">

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" [value]="email" disabled />
                <span class="field-hint">Email cannot be changed</span>
            </div>

            <div class="field">
                <label for="role">Role</label>
                <input type="text" id="role" [value]="role" disabled />
            </div>

            <div class="field">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" [(ngModel)]="fullName" required />
            </div>

            @if (errorMessage()) {
            <div class="alert error">⚠️ {{ errorMessage() }}</div>
            }

            @if (successMessage()) {
            <div class="alert success">✅ {{ successMessage() }}</div>
            }

            <button type="submit" class="submit-btn" [disabled]="saving()">
                {{ saving() ? 'Saving...' : 'Save Changes' }}
            </button>
        </form>
    </div>

    <div class="link-card">
        <a routerLink="/account/change-password">🔒 Change Password</a>
    </div>
    }
</div>

<div class="page">
    <a routerLink="/dashboard" class="back-link">← Back to Dashboard</a>

    <div class="header">
        <div class="header-icon">🔒</div>
        <div>
            <h2>Change Password</h2>
            <p class="subtitle">Keep your account secure with a strong password</p>
        </div>
    </div>

    <div class="form-card">
        <form (ngSubmit)="onSubmit()">

            <div class="field">
                <label for="currentPassword">Current Password</label>
                <div class="password-wrapper">
                    <input [type]="showCurrentPassword() ? 'text' : 'password'" id="currentPassword"
                        name="currentPassword" [(ngModel)]="currentPassword" placeholder="Enter current password"
                        required />
                    <button type="button" class="toggle-btn" (click)="toggleCurrentPassword()">
                        {{ showCurrentPassword() ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            <div class="divider"></div>

            <div class="field">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input [type]="showNewPassword() ? 'text' : 'password'" id="newPassword" name="newPassword"
                        [(ngModel)]="newPassword" placeholder="At least 6 characters" required />
                    <button type="button" class="toggle-btn" (click)="toggleNewPassword()">
                        {{ showNewPassword() ? '🙈' : '👁️' }}
                    </button>
                </div>

                @if (newPassword) {
                <div class="strength-meter">
                    <div class="strength-bar">
                        <div class="strength-fill" [class]="passwordStrength().className"
                            [style.width.%]="passwordStrength().percent">
                        </div>
                    </div>
                    <span class="strength-label" [class]="passwordStrength().className">
                        {{ passwordStrength().label }}
                    </span>
                </div>
                }
            </div>

            <div class="field">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="password-wrapper">
                    <input [type]="showConfirmPassword() ? 'text' : 'password'" id="confirmNewPassword"
                        name="confirmNewPassword" [(ngModel)]="confirmNewPassword" placeholder="Re-enter new password"
                        [class.mismatch]="!passwordsMatch()" required />
                    <button type="button" class="toggle-btn" (click)="toggleConfirmPassword()">
                        {{ showConfirmPassword() ? '🙈' : '👁️' }}
                    </button>
                </div>
                @if (!passwordsMatch()) {
                <span class="mismatch-text">Passwords don't match</span>
                }
            </div>

            @if (errorMessage()) {
            <div class="alert error">⚠️ {{ errorMessage() }}</div>
            }

            @if (successMessage()) {
            <div class="alert success">✅ {{ successMessage() }}</div>
            }

            <button type="submit" class="submit-btn" [disabled]="loading()">
                {{ loading() ? 'Updating...' : 'Update Password' }}
            </button>
        </form>
    </div>
</div>

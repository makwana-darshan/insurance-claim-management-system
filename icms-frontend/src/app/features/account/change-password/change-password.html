<div class="page">
    <h2>Change Password</h2>

    <div class="form-card">
        <form (ngSubmit)="onSubmit()">
            <div class="field">
                <label for="currentPassword">Current Password</label>
                <div class="password-wrapper">
                    <input [type]="showCurrentPassword() ? 'text' : 'password'" id="currentPassword"
                        name="currentPassword" [(ngModel)]="currentPassword" required />
                    <button type="button" class="toggle-btn" (click)="toggleCurrentPassword()">
                        {{ showCurrentPassword() ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="newPassword">New Password</label>
                <div class="password-wrapper">
                    <input [type]="showNewPassword() ? 'text' : 'password'" id="newPassword" name="newPassword"
                        [(ngModel)]="newPassword" required />
                    <button type="button" class="toggle-btn" (click)="toggleNewPassword()">
                        {{ showNewPassword() ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            <div class="field">
                <label for="confirmNewPassword">Confirm New Password</label>
                <div class="password-wrapper">
                    <input [type]="showConfirmPassword() ? 'text' : 'password'" id="confirmNewPassword"
                        name="confirmNewPassword" [(ngModel)]="confirmNewPassword" required />
                    <button type="button" class="toggle-btn" (click)="toggleConfirmPassword()">
                        {{ showConfirmPassword() ? '🙈' : '👁️' }}
                    </button>
                </div>
            </div>

            @if (errorMessage()) {
            <div class="error">{{ errorMessage() }}</div>
            }

            @if (successMessage()) {
            <div class="success">{{ successMessage() }}</div>
            }

            <button type="submit" class="submit-btn" [disabled]="loading()">
                {{ loading() ? 'Updating...' : 'Update Password' }}
            </button>
        </form>
    </div>
</div>

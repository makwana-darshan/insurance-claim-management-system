<div class="register-wrapper">
  <nav class="top-nav">
    <a routerLink="/" class="brand">
      <span class="brand-icon">🛡️</span>
      <span class="brand-text">ICMS</span>
    </a>
    <div class="nav-actions">
      <span class="nav-text">Already a member?</span>
      <a routerLink="/login" class="btn-ghost">Log In</a>
    </div>
  </nav>

  <div class="center-content">
    <div class="register-box">
      <h2>Create Account</h2>
      <p class="subtitle">Sign up to file and track your insurance claims</p>

      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" [(ngModel)]="fullName" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" required />
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required />
        </div>

        @if (errorMessage()) {
        <div class="error">{{ errorMessage() }}</div>
        }

        <button type="submit" [disabled]="loading()">
          {{ loading() ? 'Creating account...' : 'Create Account' }}
        </button>
      </form>

      <p class="login-link">
        Already have an account? <a routerLink="/login">Log in</a>
      </p>
    </div>
  </div>
</div>

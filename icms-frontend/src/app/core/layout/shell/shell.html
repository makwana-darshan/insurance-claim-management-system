<div class="shell">
  <nav class="navbar">
    <div class="navbar-left">
      <a routerLink="/dashboard" class="brand">
        <span class="brand-icon">🛡️</span>
        <span class="brand-text">ICMS</span>
      </a>

      <div class="nav-links">
        @for (link of navLinks(); track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" class="nav-link">{{ link.label }}</a>
        }
      </div>
    </div>

    <div class="navbar-right">
      <div class="user-menu">
        <button class="user-badge" (click)="toggleMenu()">
          <div class="avatar">{{ initials() }}</div>
          <div class="user-text">
            <span class="user-name">{{ user()?.fullName }}</span>
            <span class="user-role">{{ primaryRole() | titlecase }}</span>
          </div>
          <span class="chevron" [class.open]="menuOpen()">▾</span>
        </button>

        @if (menuOpen()) {
        <div class="dropdown">
          <a routerLink="/account/profile" class="dropdown-item" (click)="closeMenu()">
            <span class="item-icon">👤</span> My Profile
          </a>
          <a routerLink="/account/change-password" class="dropdown-item" (click)="closeMenu()">
            <span class="item-icon">🔒</span> Change Password
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout-item" (click)="logout()">
            <span class="item-icon">⏻</span> Logout
          </button>
        </div>
        }
      </div>
    </div>
  </nav>

  @if (menuOpen()) {
  <div class="backdrop" (click)="closeMenu()"></div>
  }

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

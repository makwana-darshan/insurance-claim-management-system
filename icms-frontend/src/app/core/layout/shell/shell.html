<div class="shell">
  <nav class="navbar">
    <div class="navbar-left">
      <div class="brand">
        <a routerLink="/dashboard" class="brand">
          <span class="brand-icon">🛡️</span>
          <span class="brand-text">ICMS</span>
        </a>
      </div>

      <div class="nav-links">
        @for (link of navLinks(); track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" class="nav-link">{{ link.label }}</a>
        }
      </div>
    </div>

    <div class="navbar-right">
      <a routerLink="/account/change-password" class="settings-link" title="Change Password">⚙️</a>

      <div class="user-badge">
        <div class="avatar">{{ initials() }}</div>
        <div class="user-text">
          <span class="user-name">{{ user()?.fullName }}</span>
          <span class="user-role">{{ primaryRole() | titlecase }}</span>
        </div>
      </div>

      <button class="logout-btn" (click)="logout()" title="Logout">
        <span class="logout-icon">⏻</span>
      </button>
    </div>
  </nav>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Admin - Assign Surveyor</title>
	<style>
		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			padding: 10px;
			border: 1px solid #ccc;
		}

		th {
			background: #f5f5f5;
		}
	</style>
</head>

<body>

	<h2>Admin – Assign Surveyor</h2>

	<table>
		<tr>
			<th>Claim ID</th>
			<th>Policy</th>
			<th>Amount</th>
			<th>Status</th>
			<th>Assign Surveyor</th>
		</tr>

		<tr th:each="claim : ${claims}">
			<td th:text="${claim.id}"></td>
			<td th:text="${claim.policyNumber}"></td>
			<td th:text="${claim.claimAmount}"></td>
			<td th:text="${claim.status}"></td>

			<td>
				<form th:action="@{/admin/claims/assign}" method="post">
					<input type="hidden" name="claimId" th:value="${claim.id}" />

					<select name="surveyorId" required>
						<option value="">Select Surveyor</option>
						<option th:each="s : ${surveyors}" th:value="${s.id}" th:text="${s.fullName}">
						</option>
					</select>

					<button type="submit">Assign</button>
				</form>
			</td>
		</tr>
	</table>

	<form th:action="@{/logout}" method="post">
		<button type="submit">Logout</button>
	</form>

</body>

</html>

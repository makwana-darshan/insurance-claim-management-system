<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Submit Claim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4">Submit Insurance Claim</h3>

        <form th:action="@{/customer/claims/submit}" th:object="${claim}" method="post">

            <div class="mb-3">
                <label>Policy Number</label>
                <input type="text" th:field="*{policyNumber}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Claim Type</label>
                <select th:field="*{claimType}" class="form-control">
                    <option>HEALTH</option>
                    <option>VEHICLE</option>
                    <option>LIFE</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Claim Amount</label>
                <input type="number" th:field="*{claimAmount}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea th:field="*{description}" class="form-control"></textarea>
            </div>

            <button class="btn btn-primary">Submit Claim</button>
        </form>
    </div>
</div>

</body>
</html>

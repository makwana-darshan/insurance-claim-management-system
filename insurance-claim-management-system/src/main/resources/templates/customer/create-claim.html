<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Create Claim | ICMS</title>
	<meta charset="UTF-8">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		body {
			background: #f1f5f9;
		}

		.card {
			border-radius: 14px;
		}
	</style>
</head>

<body>

	<nav class="navbar navbar-dark bg-dark px-4">
		<span class="navbar-brand">Insurance Claim Management System</span>
		<a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
	</nav>

	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-7">

				<div class="card shadow">
					<div class="card-header bg-primary text-white">
						<h4>Create New Claim</h4>
					</div>

					<div class="card-body">

						<form th:action="@{/customer/claim/create}" method="post">

							<div class="mb-3">
								<label class="form-label">Policy Number</label>
								<input type="text" name="policyNumber" class="form-control" required>
							</div>

							<div class="mb-3">
								<label class="form-label">Claim Type</label>
								<select name="claimType" class="form-select" required>
									<option value="">-- Select --</option>
									<option value="HEALTH">Health</option>
									<option value="VEHICLE">Vehicle</option>
									<option value="LIFE">Life</option>
								</select>
							</div>

							<div class="mb-3">
								<label class="form-label">Claim Amount</label>
								<input type="number" name="claimAmount" class="form-control" required>
							</div>

							<div class="d-grid">
								<button class="btn btn-success">Save & Submit Claim</button>
							</div>

						</form>

					</div>
				</div>

			</div>
		</div>
	</div>

</body>

</html>

spring.application.name=insurance-claim-management-system
# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/icms_db
spring.datasource.username=root
spring.datasource.password=6113

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# JWT
jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_256_BIT_SECRET_STRING_1234567890
jwt.expiration-ms=3600000
